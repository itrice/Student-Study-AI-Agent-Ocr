apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-study-ai-agent-ocr
  namespace: student-study-ai-agent-ocr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: student-study-ai-agent-ocr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-study-ai-agent-ocr
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ocr
          image: __PLATFORM_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: OCR_BACKEND
              value: cpu
            - name: OCR_VERSION
              value: PP-OCRv6
            - name: OCR_CPU_THREADS
              value: "2"
            - name: MAX_IMAGE_BYTES
              value: "10485760"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "60"
            - name: ENABLE_LAYOUT
              value: "false"
            - name: ENABLE_FORMULA
              value: "false"
            - name: MODEL_DIR
              value: /models
            - name: TMP_DIR
              value: /tmp/ocr
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
