name: Deploy internal OCR

on:
  push:
    branches:
      - main
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: internal-ocr-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/itrice/student-study-ai-agent-ocr-service:sha-${{ github.sha }}
          outputs: type=image,push=true
          provenance: false

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test immutable image
        env:
          IMAGE_URI: ghcr.io/itrice/student-study-ai-agent-ocr-service:sha-${{ github.sha }}@${{ needs.build.outputs.digest }}
        run: |
          docker pull "${IMAGE_URI}"
          docker run --rm \
            --read-only \
            --tmpfs /tmp/ocr:rw,mode=1777,size=64m \
            --volume "${GITHUB_WORKSPACE}/tests:/tests:ro" \
            "${IMAGE_URI}" \
            python -m unittest discover -s /tests -v

          docker run --detach --name ocr-candidate \
            --read-only \
            --tmpfs /tmp/ocr:rw,mode=1777,size=64m \
            --publish 127.0.0.1:8000:8000 \
            "${IMAGE_URI}"
          cleanup() {
            docker logs ocr-candidate || true
            docker rm --force ocr-candidate >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker exec -i ocr-candidate python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont

          base_url = "http://127.0.0.1:8000"
          deadline = time.monotonic() + 120
          while True:
              try:
                  with urllib.request.urlopen(f"{base_url}/health/ready", timeout=2) as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  if time.monotonic() >= deadline:
                      raise TimeoutError("OCR candidate did not become ready")
                  time.sleep(2)

          image = Image.new("RGB", (1000, 260), "white")
          ImageDraw.Draw(image).text(
              (40, 75), "Hello OCR 12345",
              font=ImageFont.load_default(size=72),
              fill="black",
          )
          image_data = BytesIO()
          image.save(image_data, format="PNG")

          boundary = "ocr-candidate-smoke-test"
          body = (
              f"--{boundary}\r\n"
              'Content-Disposition: form-data; name="image"; filename="smoke.png"\r\n'
              "Content-Type: image/png\r\n\r\n"
          ).encode() + image_data.getvalue() + f"\r\n--{boundary}--\r\n".encode()
          request = urllib.request.Request(
              f"{base_url}/v1/ocr",
              data=body,
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)

          text = " ".join(block["text"] for block in result["blocks"])
          if not all(token in text for token in ("Hello", "OCR", "12345")):
              raise SystemExit(f"OCR smoke test failed; recognized text: {text!r}")
          print(f"OCR image smoke test passed: {text}")
          PY

  deploy:
    needs: [build, validate]
    runs-on:
      - self-hosted
      - linux
      - x64
      - Student-Study-OCR-Runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Create GHCR pull secret
        env:
          REGISTRY_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [[ -z "${REGISTRY_USERNAME}" || -z "${REGISTRY_TOKEN}" ]]; then
            echo "Configure GHCR_PULL_USERNAME and GHCR_PULL_TOKEN repository secrets." >&2
            exit 1
          fi

          kubectl apply -f k8s/namespace.yaml
          kubectl -n student-study-ai-agent-ocr create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${REGISTRY_USERNAME}" \
            --docker-password="${REGISTRY_TOKEN}" \
            --dry-run=client -o yaml |
            kubectl apply -f -

      - name: Deploy immutable image
        env:
          IMAGE_URI: ghcr.io/itrice/student-study-ai-agent-ocr-service:sha-${{ github.sha }}@${{ needs.build.outputs.digest }}
        run: |
          for manifest in k8s/*.yaml; do
            sed "s|__PLATFORM_IMAGE__|${IMAGE_URI}|g" "${manifest}" |
              kubectl apply -f -
          done

          kubectl -n student-study-ai-agent-ocr rollout status \
            deployment/student-study-ai-agent-ocr --timeout=300s

      - name: Smoke test deployed image
        env:
          IMAGE_URI: ghcr.io/itrice/student-study-ai-agent-ocr-service:sha-${{ github.sha }}@${{ needs.build.outputs.digest }}
        run: |
          pod="$(kubectl -n student-study-ai-agent-ocr get pod \
            -l app.kubernetes.io/name=student-study-ai-agent-ocr \
            -o jsonpath='{.items[0].metadata.name}')"
          pod_image="$(kubectl -n student-study-ai-agent-ocr get pod "${pod}" \
            -o jsonpath='{.spec.containers[?(@.name=="ocr")].image}')"
          if [[ "${pod_image}" != "${IMAGE_URI}" ]]; then
            echo "Expected deployed image ${IMAGE_URI}, found ${pod_image}." >&2
            exit 1
          fi

          kubectl -n student-study-ai-agent-ocr exec -i "${pod}" -- python - <<'PY'
          import json
          import urllib.request
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont

          image = Image.new("RGB", (1000, 260), "white")
          ImageDraw.Draw(image).text(
              (40, 75), "Hello OCR 12345",
              font=ImageFont.load_default(size=72),
              fill="black",
          )
          image_data = BytesIO()
          image.save(image_data, format="PNG")

          boundary = "ocr-deployed-smoke-test"
          body = (
              f"--{boundary}\r\n"
              'Content-Disposition: form-data; name="image"; filename="smoke.png"\r\n'
              "Content-Type: image/png\r\n\r\n"
          ).encode() + image_data.getvalue() + f"\r\n--{boundary}--\r\n".encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8000/v1/ocr",
              data=body,
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)

          text = " ".join(block["text"] for block in result["blocks"])
          if not all(token in text for token in ("Hello", "OCR", "12345")):
              raise SystemExit(f"Deployed OCR smoke test failed; recognized text: {text!r}")
          print(f"Deployed OCR smoke test passed: {text}")
          PY
